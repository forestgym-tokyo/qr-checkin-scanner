<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ラック利用登録 / Rack Use Registration</title>
<style>
:root{--panel:#11151a;--line:rgba(255,255,255,.10);--text:#fff;--muted:rgba(255,255,255,.62);--green:#78c53a;--green2:#5fab24;--blue:#2f80ed;--orange:#d08a20;--danger:#d9534f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#060708,#030405);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Roboto,sans-serif;min-height:100vh}
.app{max-width:620px;margin:0 auto;padding:22px 16px 36px}.logo{display:block;width:210px;max-width:62vw;margin:0 auto 18px;object-fit:contain}
h1{font-size:27px;line-height:1.25;margin:0 0 6px;font-weight:900}.sub{font-size:13px;color:var(--muted);margin-bottom:20px}.card{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
label{display:block;font-size:13px;color:rgba(255,255,255,.65);margin:14px 0 7px}input{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;padding:15px 14px;font-size:17px;outline:none}input:focus{border-color:rgba(120,197,58,.7)}
button{appearance:none;border:0;border-radius:14px;cursor:pointer;font-weight:800;color:#fff}.primary{width:100%;padding:15px;margin-top:18px;background:linear-gradient(180deg,var(--green),var(--green2));font-size:17px}.secondary{width:100%;padding:13px;margin-top:10px;background:rgba(255,255,255,.10);font-size:15px}.primary:disabled,.secondary:disabled{opacity:.55;cursor:default}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:8px}.suggestions{display:none;margin-top:12px;padding:12px;border-radius:14px;background:rgba(120,197,58,.07);border:1px solid rgba(120,197,58,.18)}.suggestion-title{font-size:12px;font-weight:900;color:#dfffc8;margin-bottom:9px}.suggestion-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.suggestion-btn{width:100%;padding:11px 9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.11);text-align:left}.suggestion-btn span{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px}.suggestion-btn strong{display:block;font-size:14px;line-height:1.25;color:#fff}.suggestion-foot{font-size:10px;color:var(--muted);margin-top:8px}.error{display:none;margin:12px 0 0;padding:12px;border-radius:12px;background:rgba(217,83,79,.12);border:1px solid rgba(217,83,79,.3);color:#ffd8d7;font-size:13px;line-height:1.5}.error.show{display:block}
#statusArea{display:none}.status-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 14px}.status-title{font-size:24px;font-weight:900}.updated{font-size:11px;color:var(--muted);text-align:right;white-space:pre-line}.rack-grid{display:grid;grid-template-columns:1fr;gap:12px}.rack-card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px}.rack-card.free{border-color:rgba(120,197,58,.34)}.rack-card.reserved{border-color:rgba(208,138,32,.38)}.rack-card.maintenance{border-color:rgba(63,130,200,.38)}.rack-top{display:grid;grid-template-columns:92px 1fr;gap:14px}.rack-img{width:88px;height:88px;object-fit:contain}.rack-no{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:4px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;margin-bottom:8px;background:rgba(255,255,255,.09)}.badge.free{background:rgba(120,197,58,.16);color:#eaffd6}.badge.reserved{background:rgba(208,138,32,.16);color:#ffe0ae}.badge.maintenance{background:rgba(63,130,200,.16);color:#d8ebff}.current{font-size:19px;line-height:1.25;font-weight:900}.small{font-size:13px;line-height:1.45;color:rgba(255,255,255,.76);margin-top:4px}.divider{height:1px;background:rgba(255,255,255,.08);margin:11px 0}.next-label{font-size:11px;color:var(--muted);font-weight:800}.next{font-size:16px;font-weight:800;margin-top:3px}.count{font-size:12px;color:var(--muted);margin-top:8px}.actions{margin-top:14px}.use-btn{width:100%;padding:14px;background:linear-gradient(180deg,var(--green),var(--green2));font-size:16px}.queue-btn{width:100%;padding:13px;background:rgba(255,255,255,.12);font-size:15px}.member-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding:10px 12px;border-radius:13px;background:rgba(120,197,58,.08);border:1px solid rgba(120,197,58,.16);font-size:12px}.member-name{font-weight:900}.change-btn{padding:8px 10px;background:rgba(255,255,255,.10);font-size:12px;white-space:nowrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:100%;max-width:420px;background:#171b21;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px}.modal-title{font-size:22px;font-weight:900;margin-bottom:6px}.modal-sub{font-size:12px;line-height:1.55;color:var(--muted)}.auth-input{font-size:28px;letter-spacing:.28em;text-align:center;margin-top:12px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.cancel-btn{padding:14px;background:rgba(255,255,255,.10);font-size:15px}.confirm-btn{padding:14px;background:var(--blue);font-size:15px}.footer{text-align:center;color:rgba(255,255,255,.25);font-size:10px;margin-top:24px}
</style>
</head>
<body>
<div class="app">
  <img class="logo" src="logo.png" alt="The Forest Gym">
  <section id="loginArea">
    <h1>ラック利用登録</h1>
    <div class="sub">Rack Use Registration / 会員さま専用</div>
    <div class="card">
      <label for="email">メールアドレス / Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <label for="displayName">表示名 / Display Name</label>
      <input id="displayName" maxlength="20" autocomplete="off">
      <div class="suggestions" id="displayNameSuggestions">
        <div class="suggestion-title">AIオススメの表示名</div>
        <div class="suggestion-grid">
          <button type="button" class="suggestion-btn" onclick="applyDisplayNameSuggestion('male')"><strong id="maleSuggestion"></strong></button>
          <button type="button" class="suggestion-btn" onclick="applyDisplayNameSuggestion('female')"><strong id="femaleSuggestion"></strong></button>
        </div>
      </div>
      <div class="note">前回使用した表示名がある場合は自動表示されます。未入力の場合は会員氏名を使用します。</div>
      <button class="primary" id="memberBtn" onclick="verifyMember()">利用状況を見る</button>
      <div class="error" id="loginError"></div>
    </div>
  </section>

  <section id="statusArea">
    <div class="member-bar">
      <div><span class="member-name" id="memberDisplay">ACT会員</span><br><span id="memberEmail"></span></div>
      <button class="change-btn" onclick="resetMember()">変更</button>
    </div>
    <div class="status-head">
      <div class="status-title">ラック利用状況</div>
      <div class="updated" id="lastUpdated">--</div>
    </div>
    <div class="error" id="statusError"></div>
    <div class="rack-grid" id="rackGrid"></div>
    <button class="secondary" id="refreshBtn" onclick="loadStatus()">最新情報に更新</button>
  </section>
  <div class="footer">Copyright©2026 A-nauts Co., Ltd.</div>
</div>

<div class="modal" id="authModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-title">認証コード入力</div>
    <div class="modal-sub">店内タブレットに表示されている4桁の認証コードを入力してください。<br>利用登録・順番待ち登録の実行時のみ必要です。</div>
    <input class="auth-input" id="authCode" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeAuthModal()">キャンセル</button>
      <button class="confirm-btn" id="authConfirmBtn" onclick="confirmAction()">登録する</button>
    </div>
    <div class="error" id="authError"></div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbx6mZdlpMCIcMWLcdH9J9O2n_1b2XuNcvW4TtvRqEFJ97Uz4Fp3C-6w-UlX5lXC3izn2Q/exec";
const DISPLAY_NAME_KEY="tfgRackDisplayName";
const REFRESH_MS=15000;
const MEMBER_OK_MESSAGE="ラック番号が取得できませんでした。";
const DISPLAY_NAME_POOLS={
  male:{
    ja:["最高にイケてる男","無敵のナイスガイ","男前レジェンド","魅惑の紳士","スタイル王","今日もカッコいい","筋肉ジェントルマン","最強の伊達男","鋼の使者","風のスクワッター","雷のベンチマン","静かなるデッドリフター","ケーブルの魔術師","バーベル侍","懸垂の達人","鉄の旅人","筋肉の伝道師","ラックの番人","スクワット職人","ベンチの切り札","デッドリフト忍者","ダンベルの貴公子","ショルダープレス侍","レッグプレス隊長","パワーの冒険者","鉄壁のリフター","爆発系ベンチマン","風来のスクワット男","筋トレの申し子","鉄の錬金術師","重力への挑戦者","筋肉の案内人"],
    en:["Mr. Cool Guy","Mr. Perfect","The Gentleman","King of Style","The Legend","Handsome Boss","Super Nice Guy","Mr. Awesome","Steel Messenger","Wind Squat Ninja","Thunder Bench Ace","Deadlift Maverick","Cable Wizard","Barbell Samurai","Pull-Up Hero","Iron Traveler","Muscle Messenger","Rack Guardian","Squat Craftsman","Bench Wildcard","Deadlift Ninja","Dumbbell Rogue","Press Samurai","Leg Press Captain","Power Voyager","Iron Lifter","Bench Beast","Squat Drifter","Lift Alchemist","Gravity Challenger","Muscle Guide","Storm Lifter"]
  },
  female:{
    ja:["美ボディ女神","輝く美女","美しきクイーン","スタイル女王","今日も美しい","奇跡のレディ","魅惑の美女","最強の美人","スクワット姫","ヒップスラストの華","風のスクワット娘","雷のリフター","鉄のミューズ","ケーブルの魔女","バーベルの妖精","ダンベル天使","美尻の使者","レッグプレスの華","デッドリフトの星","しなやかリフター","パワーの女神","鉄の旅人","筋トレの申し子","重力と踊る人","スクワットの妖精","ケーブルの歌姫","バーベル美人","ヒップスラスト名人","ラックの華","風来のリフター","筋肉の案内人","鉄の錬金術師"],
    en:["The Beauty","Miss Gorgeous","Queen of Style","Beautiful Star","The Elegant","Glam Queen","Miss Fabulous","Beauty Legend","Squat Princess","Hip Thrust Star","Wind Squat Star","Thunder Lifter","Iron Muse","Cable Witch","Barbell Fairy","Dumbbell Angel","Glute Messenger","Leg Press Star","Deadlift Star","Smooth Lifter","Power Goddess","Iron Traveler","Fitness Prodigy","Gravity Dancer","Squat Fairy","Cable Diva","Barbell Beauty","Hip Thrust Ace","Rack Star","Wind Lifter","Muscle Guide","Iron Alchemist"]
  }
};
let displayNameSuggestionValues={male:"",female:""};
let memberSession=null;
let pendingAction=null;
let refreshTimer=null;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function showError(id,msg){const e=document.getElementById(id);if(!e)return;e.textContent=msg||"エラーが発生しました。";e.classList.add("show")}
function hideError(id){const e=document.getElementById(id);if(!e)return;e.textContent="";e.classList.remove("show")}
function setBusy(id,busy,text){const b=document.getElementById(id);if(!b)return;b.disabled=!!busy;if(text)b.textContent=text}
function isValidDisplayName(name){const v=String(name||"").trim();if(!v)return true;if(v.length<3)return false;const upper=v.toUpperCase();const ng=["あああ","あいう","アイウ","AAA","ABC","111","123"];if(ng.includes(upper)||ng.includes(v))return false;if(/^(.)\1+$/.test(v))return false;if(/^\d+$/.test(v))return false;return true}
function pickRandom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function createRandomDisplayName(kind){const pools=DISPLAY_NAME_POOLS[kind];const lang=Math.random()<0.5?"ja":"en";return pickRandom(pools[lang])}
function hideDisplayNameSuggestions(){document.getElementById("displayNameSuggestions").style.display="none"}
function renderDisplayNameSuggestions(){
  const input=document.getElementById("displayName");
  const wrap=document.getElementById("displayNameSuggestions");
  if(input.value.trim()){wrap.style.display="none";return}
  displayNameSuggestionValues.male=createRandomDisplayName("male");
  displayNameSuggestionValues.female=createRandomDisplayName("female");
  document.getElementById("maleSuggestion").textContent=displayNameSuggestionValues.male;
  document.getElementById("femaleSuggestion").textContent=displayNameSuggestionValues.female;
  wrap.style.display="block";
}
function applyDisplayNameSuggestion(kind){
  const value=displayNameSuggestionValues[kind]||"";
  if(!value)return;
  document.getElementById("displayName").value=value;
  hideDisplayNameSuggestions();
}
function restoreDisplayName(){
  let saved="";
  try{saved=localStorage.getItem(DISPLAY_NAME_KEY)||""}catch(e){}
  document.getElementById("displayName").value=saved;
  if(saved)hideDisplayNameSuggestions();else renderDisplayNameSuggestions();
}
function saveDisplayName(v){try{if(v)localStorage.setItem(DISPLAY_NAME_KEY,v)}catch(e){}}

async function post(params){const body=new URLSearchParams();Object.keys(params||{}).forEach(k=>body.append(k,params[k]??""));const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:body.toString(),cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);return await res.json()}
async function fetchSchedule(){const res=await fetch(API_URL+"?action=getscheduletabletjson&t="+Date.now(),{method:"GET",cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const raw=await res.json();return{todayLabel:String(raw?.todayLabel||""),lastUpdatedText:String(raw?.lastUpdatedText||raw?.lastUpdated||""),racks:Array.isArray(raw?.racks)?raw.racks:[]}}

async function verifyMember(){
  hideError("loginError");
  const email=document.getElementById("email").value.trim().toLowerCase();
  const displayName=document.getElementById("displayName").value.trim();
  if(!email){showError("loginError","メールアドレスを入力してください。");return}
  if(displayName&&!isValidDisplayName(displayName)){showError("loginError","表示名は3文字以上で入力してください。あああ、あいう、ABC、AAA、111などは使用できません。");return}
  setBusy("memberBtn",true,"確認中...");
  try{
    const probe=await post({action:"checkInNow",entryMethod:"email",email:email,rackNo:"",displayName:""});
    if(!probe||String(probe.message||"")!==MEMBER_OK_MESSAGE){showError("loginError","ACT会員を確認できませんでした。登録済みのメールアドレスをご確認ください。");return}
    memberSession={email:email,displayName:displayName};
    saveDisplayName(displayName);
    document.getElementById("memberDisplay").textContent=displayName||"ACT会員";
    document.getElementById("memberEmail").textContent=email;
    document.getElementById("loginArea").style.display="none";
    document.getElementById("statusArea").style.display="block";
    renderStatus(await fetchSchedule());
    startRefresh();
  }catch(e){showError("loginError","通信エラーが発生しました。")}finally{setBusy("memberBtn",false,"利用状況を見る")}
}

function normalizeState(v){const s=String(v||"free").toLowerCase();if(s==="free")return"free";if(s==="maintenance")return"maintenance";if(s==="reserved")return"reserved";return"using"}
function badgeLabel(r){return r.badgeTextJa||r.badgeText||({free:"空き",maintenance:"メンテ中",reserved:"予約あり",using:"利用中"}[normalizeState(r.state)]||"利用中")}
function renderRack(r){
  const state=normalizeState(r.state);const no=Number(r.rackNo)||0;
  const useBtn=(r.showUseNowButton&&state!=="maintenance")?`<button class="use-btn" onclick="requestAction('use',${no})">${esc(r.useNowLabelJa||"すぐに利用")}</button>`:"";
  const queueBtn=(r.showQueueButton&&state!=="maintenance")?`<button class="queue-btn" onclick="requestAction('queue',${no})">${esc(r.queueButtonText||"順番待ち")}</button>`:"";
  return `<article class="rack-card ${state}"><div class="rack-top"><div><img class="rack-img" src="rack${no}.png" alt="Rack ${no}"></div><div><div class="rack-no">RACK №${no}</div><div class="badge ${state}">${esc(badgeLabel(r))}</div><div class="current">${esc(r.currentText||"—")}</div>${r.currentSubText?`<div class="small">${esc(r.currentSubText)}</div>`:""}<div class="divider"></div><div class="next-label">次の予定 / NEXT</div><div class="next">${esc(r.nextText||"予定なし")}</div>${r.nextSubText?`<div class="small">${esc(r.nextSubText)}</div>`:""}<div class="count">予定数 / SCHEDULES：${Number(r.waitingCount)||0}件</div></div></div>${(useBtn||queueBtn)?`<div class="actions">${useBtn||queueBtn}</div>`:""}</article>`
}
function renderStatus(data){hideError("statusError");document.getElementById("lastUpdated").textContent="最終更新 / LAST UPDATED\n"+(data.lastUpdatedText||"--");const racks=Array.isArray(data.racks)?data.racks.slice():[];racks.sort((a,b)=>(Number(a.rackNo)||0)-(Number(b.rackNo)||0));document.getElementById("rackGrid").innerHTML=racks.map(renderRack).join("")}
async function loadStatus(){if(!memberSession)return;hideError("statusError");setBusy("refreshBtn",true,"更新中...");try{renderStatus(await fetchSchedule())}catch(e){showError("statusError","利用状況の取得に失敗しました。")}finally{setBusy("refreshBtn",false,"最新情報に更新")}}
function startRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(loadStatus,REFRESH_MS)}
function stopRefresh(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}}
function resetMember(){stopRefresh();memberSession=null;pendingAction=null;document.getElementById("statusArea").style.display="none";document.getElementById("loginArea").style.display="block";hideError("loginError")}

function requestAction(kind,rackNo){if(!memberSession)return;pendingAction={kind:kind,rackNo:rackNo};document.getElementById("authCode").value="";hideError("authError");document.getElementById("authConfirmBtn").textContent=kind==="use"?"利用登録する":"順番待ち登録する";document.getElementById("authModal").classList.add("show");setTimeout(()=>document.getElementById("authCode").focus(),80)}
function closeAuthModal(){pendingAction=null;document.getElementById("authModal").classList.remove("show");hideError("authError")}

async function confirmAction(){
  if(!memberSession||!pendingAction)return;
  const selected={kind:pendingAction.kind,rackNo:pendingAction.rackNo};
  hideError("authError");
  const code=document.getElementById("authCode").value.trim();
  if(!/^\d{4}$/.test(code)){showError("authError","4桁の認証コードを入力してください。");return}
  const btn=document.getElementById("authConfirmBtn");btn.disabled=true;btn.textContent="認証中...";
  try{
    const auth=await post({action:"validateAuthCode",authCode:code});
    if(!auth||!auth.ok){showError("authError",auth?.message||"認証コードが正しくありません。");return}
    btn.textContent="処理中...";
    let res;
    if(selected.kind==="use"){
      res=await post({action:"checkInNow",rackNo:selected.rackNo,email:memberSession.email,displayName:memberSession.displayName,entryMethod:"email"});
    }else{
      res=await post({action:"registerQueue",rackNo:selected.rackNo,email:memberSession.email,displayName:memberSession.displayName,authCode:code,fromTablet:"0",confirmedShortSlot:"false"});
    }
    if(!res||!res.ok){showError("authError",res?.message||"登録できませんでした。");return}
    saveDisplayName(memberSession.displayName);
    document.getElementById("authModal").classList.remove("show");pendingAction=null;
    alert(selected.kind==="use"
      ?"利用登録が完了しました。\nチェックイン済みです。そのままラックをご利用ください。"
      :"順番待ち登録が完了しました。\nチェックイン用QRコードをメール送信しました。");
    await loadStatus();
  }catch(e){showError("authError","通信エラーが発生しました。")}
  finally{btn.disabled=false;btn.textContent=selected.kind==="use"?"利用登録する":"順番待ち登録する"}
}

document.getElementById("authCode").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"").slice(0,4)});
document.getElementById("displayName").addEventListener("input",function(){if(this.value.trim())hideDisplayNameSuggestions();else renderDisplayNameSuggestions()});
restoreDisplayName();
</script>
</body>
</html>
